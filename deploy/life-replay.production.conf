server {
    listen 127.0.0.1:18080;
    server_name life-reroll.hasaki.idv.tw;
    root /opt/life-replay/current/life-reroll-frontend-20261016-212920/dist;
    index index.html;
    gzip_static on;
    gzip_vary on;
    access_log /var/log/nginx/life-replay.access.log;
    error_log /var/log/nginx/life-replay.error.log;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_cache off;
    proxy_hide_header X-Dev-Verification-Token;
    client_max_body_size 12m;
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:18081;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }
    location = /docx {
        proxy_pass http://127.0.0.1:18081;
        add_header Cache-Control "no-store" always;
    }
    location = /openapi.json {
        proxy_pass http://127.0.0.1:18081;
        add_header Cache-Control "no-store" always;
    }
    location ~ (^|/)\. { deny all; }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(webp|png|jpe?g|svg|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }
    location ~ ^/(full|demo|city|terms|privacy|training|teach)/?$ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location ~ ^/place/(work|hospital|leisure|finance)/?$ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
    location = /site.webmanifest {
        default_type application/manifest+json;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
