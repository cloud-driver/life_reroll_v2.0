# Include INSIDE your existing HTTPS server {}. Adjust root to your deployment.
# Requires ngx_http_gzip_static_module (check: nginx -V).
root /opt/life-reroll/life-reroll-frontend-20261016-212920/dist;
index index.html;
gzip_static on;
gzip_vary on;

location ^~ /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    client_max_body_size 12m;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "no-store" always;
}
location ^~ /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location ~* \.(webp|png|jpe?g|svg|ico|woff2?)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600";
}
location ~ ^/(full|demo|city|terms|privacy|training|teach)/?$ {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
}
location ~ ^/place/(work|hospital|leisure|finance)/?$ {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
}
location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache";
}
